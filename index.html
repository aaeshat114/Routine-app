<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kids Routine App</title>
  <meta name="theme-color" id="pwa-theme-color" content="#b4c3dd">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <button id="global-nav-toggle" class="nav-toggle">
  <svg viewBox="0 0 24 24" class="nav-icon">

    <path class="path-parent" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
  </svg>
</button>

  <div id="view-kids-hub" class="view active kids-theme">
    <h1>My Routines</h1>
    <div id="kids-routine-grid" class="grid-container"></div>
  </div>

  <div id="view-active-routine" class="view kids-theme">
    <div id="routine-container" class="split-screen-container"></div>
  </div>

  <div id="view-parent-dash" class="view parent-theme hidden">
    <h1>Dashboard</h1>
    <div class="panel">
      <h2>Profiles</h2>
      <div id="profile-list"></div>
      <input type="text" id="new-profile-name" placeholder="Child's Name">
      <button id="btn-add-profile">Add Child</button>
    </div>
    <div class="panel">
      <h2>Routines</h2>
      <div id="parent-routine-list"></div>
      <button id="btn-new-routine">Create New Routine</button>
    </div>
  </div>

  <div id="view-routine-builder" class="view parent-theme hidden">
    <h1>Routine Builder</h1>
    <input type="text" id="builder-routine-name" placeholder="Routine Name">
    <div id="builder-task-list"></div>
    <button id="btn-add-task">Add Task</button>
    <button id="btn-save-routine" class="primary">Save Routine</button>
  </div>

  <div id="modal-recovery" class="modal hidden">
    <div class="modal-content kids-theme">
      <h2>Resume Routine?</h2>
      <p>You were in the middle of a routine.</p>
      <button id="btn-resume-session" class="no-btn">Resume</button>
      <button id="btn-scrap-session" class="yes-btn">Scrap Session</button>
    </div>
  </div>

  <div id="modal-gate" class="modal hidden">
    <div class="modal-content parent-theme">
      <button class="close-modal">X</button>
      <h2>Parent Unlock</h2>
      <p>Tap the prime number to enter.</p>
      <div id="gate-grid" class="grid-3x3"></div>
    </div>
  </div>

  <div id="modal-participant" class="modal hidden">
    <div class="modal-content kids-theme">
      <button class="close-modal">X</button>
      <h2>Who is doing this?</h2>
      <div id="participant-list"></div>
      <button id="btn-start-routine" class="kid-btn">Start</button>
    </div>
  </div>

  <div id="modal-confirm" class="modal hidden">
    <div class="modal-content">
      <h2 id="confirm-title">Are you sure?</h2>
      <button id="btn-confirm-yes" class="yes-btn">Yes</button>
      <button id="btn-confirm-no" class="no-btn">No</button>
    </div>
  </div>

    <div id="modal-image-picker" class="modal hidden">
    <div class="modal-content parent-theme">
      <button class="close-modal">X</button>
      <h2>Select Task Image</h2>
      <div id="image-picker-grid" class="grid-container"></div>
    </div>
    </div>

  <script src="app.js"></script>
</body>
</html>
